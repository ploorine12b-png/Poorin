<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Red Sports Car WebAR</title>
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .ui-container {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      gap: 12px;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 20px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
    }
    .btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      color: white;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn-red { background-color: #e74c3c; }
    .btn-yellow { background-color: #f1c40f; color: #2c3e50; }
    .btn-blue { background-color: #3498db; }
    .btn-spin { background-color: #2ecc71; }
    
    #statusText {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="statusText">ส่องกล้องไปที่รูป Hiro Marker</div>

  <div class="ui-container">
    <button class="btn btn-spin" onclick="toggleSpin()">หมุนรถ</button>
    <button class="btn btn-red" onclick="changeColor('#d63031')">แดง</button>
    <button class="btn btn-yellow" onclick="changeColor('#f1c40f')">เหลือง</button>
    <button class="btn btn-blue" onclick="changeColor('#0984e3')">น้ำเงิน</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- Asset Management -->
    <a-assets>
      <!-- ใช้โมเดลรถสปอร์ตฟรีจากระบบ -->
      <a-asset-item id="carModel" src="https://raw.githack.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMilktruck/glTF-Binary/CesiumMilktruck.glb"></a-asset-item>
    </a-assets>

    <!-- Marker (Hiro) -->
    <a-marker preset="hiro" id="hiroMarker">
      <!-- ตัวรถสปอร์ตสีแดง -->
      <a-entity id="sportsCarGroup">
        <!-- ตัวถังรถสปอร์ตสร้างด้วยรูปทรง 3D (Red Sports Car) -->
        <!-- Main Body -->
        <a-box id="carBody" position="0 0.25 0" width="1" height="0.3" depth="2" color="#d63031" material="roughness: 0.2; metalness: 0.5"></a-box>
        <!-- Cabin / Roof -->
        <a-box id="carRoof" position="0 0.5 -0.1" width="0.8" height="0.25" depth="0.9" color="#2d3436" material="roughness: 0.1; metalness: 0.8"></a-box>
        <!-- Hood / Front -->
        <a-box position="0 0.28 0.7" width="0.95" height="0.15" depth="0.5" color="#d63031"></a-box>
        
        <!-- Wheels -->
        <a-cylinder position="0.55 0.15 0.6" rotation="0 0 90" radius="0.18" height="0.1" color="#1e272e"></a-cylinder>
        <a-cylinder position="-0.55 0.15 0.6" rotation="0 0 90" radius="0.18" height="0.1" color="#1e272e"></a-cylinder>
        <a-cylinder position="0.55 0.15 -0.6" rotation="0 0 90" radius="0.18" height="0.1" color="#1e272e"></a-cylinder>
        <a-cylinder position="-0.55 0.15 -0.6" rotation="0 0 90" radius="0.18" height="0.1" color="#1e272e"></a-cylinder>

        <!-- Headlights -->
        <a-sphere position="0.35 0.28 0.96" radius="0.06" color="#ffff80" material="emissive: #ffff80; emissiveIntensity: 0.8"></a-sphere>
        <a-sphere position="-0.35 0.28 0.96" radius="0.06" color="#ffff80" material="emissive: #ffff80; emissiveIntensity: 0.8"></a-sphere>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    let isSpinning = false;
    let spinInterval;
    const carGroup = document.getElementById('sportsCarGroup');
    const carBody = document.getElementById('carBody');
    let currentRotation = 0;

    // ฟังก์ชันเปิด/ปิด การหมุนรถ
    function toggleSpin() {
      if (!isSpinning) {
        isSpinning = true;
        spinInterval = setInterval(() => {
          currentRotation += 2;
          carGroup.setAttribute('rotation', `0 ${currentRotation} 0`);
        }, 20);
      } else {
        isSpinning = false;
        clearInterval(spinInterval);
      }
    }

    // ฟังก์ชันเปลี่ยนสีรถ
    function changeColor(colorHex) {
      carBody.setAttribute('color', colorHex);
    }

    // ตรวจจับการเจอ Marker
    const marker = document.getElementById('hiroMarker');
    const statusText = document.getElementById('statusText');

    marker.addEventListener('markerFound', () => {
      statusText.innerText = 'พบ Hiro Marker แล้ว!';
      statusText.style.background = 'rgba(46, 204, 113, 0.8)';
    });

    marker.addEventListener('markerLost', () => {
      statusText.innerText = 'ส่องกล้องไปที่รูป Hiro Marker';
      statusText.style.background = 'rgba(0, 0, 0, 0.7)';
    });
  </script>
</body>
</html>
