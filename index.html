<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Mobile AR Lab</title>
    <!-- โหลด A-Frame และ AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      /* จัดสไตล์ปุ่มกดด้านล่างหน้าจอ */
      .ui-container {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 999;
      }
      .btn {
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn-stop { background-color: #ffffff; color: #000; }
      .btn-warn { background-color: #ffcc00; color: #000; }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- ปุ่มควบคุม UI บนมือถือ -->
    <div class="ui-container">
      <button class="btn btn-stop" onclick="toggleMotor()">หยุดมอเตอร์</button>
      <button class="btn btn-warn" onclick="triggerWarning()">จำลองคำเตือน</button>
    </div>

    <!-- ฉาก AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- สแกนหา Hiro Marker -->
      <a-marker preset="hiro">
        
        <!-- โมเดลมอเตอร์ 3D (จำลองทรงกระบอก) -->
        <a-entity id="motorGroup" position="0 0.5 0">
          <a-cylinder id="motorBody" position="0 0 0" radius="0.5" height="1.2" rotation="0 0 90" color="#1e88e5"></a-cylinder>
          <a-cylinder position="0 0 0" radius="0.15" height="1.8" rotation="0 0 90" color="#aaaaaa"></a-cylinder>
          
          <!-- ข้อความแสดงสถานะ บนโมเดล 3D -->
          <a-text id="statusText" value="MOTOR M1\nSTATUS: NORMAL" position="0 0.8 0" align="center" color="#ffffff" width="4"></a-text>
        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <!-- สคริปต์ควบคุมการทำงานเมื่อกดปุ่ม -->
    <script>
      let isRunning = true;

      function toggleMotor() {
        const text = document.getElementById('statusText');
        const motor = document.getElementById('motorBody');
        if (isRunning) {
          text.setAttribute('value', 'MOTOR M1\nSTATUS: STOPPED');
          motor.setAttribute('color', '#757575');
          isRunning = false;
        } else {
          text.setAttribute('value', 'MOTOR M1\nSTATUS: NORMAL');
          motor.setAttribute('color', '#1e88e5');
          isRunning = true;
        }
      }

      function triggerWarning() {
        const text = document.getElementById('statusText');
        const motor = document.getElementById('motorBody');
        text.setAttribute('value', 'MOTOR M1\nSTATUS: WARNING!');
        motor.setAttribute('color', '#e53935');
        isRunning = false;
      }
    </script>
  </body>
</html>
